syntax = "proto3";

service AuthService {
  rpc Authenticate (AuthRequest) returns (AuthResponse);
}

service VPNService {
  rpc createVPN(CreationRequest)
}

message AuthRequest {
  string username = 1;
  string password = 2;
}

message AuthResponse {
  string token = 1;
}

message CreationRequest {
  string name = 1;
}
message CreationResponse {
  bool;
}